<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="420" height="330" role="img" aria-label="会话右键菜单中的“彻底删除会话…”项">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="420" height="330" fill="#141417"/>
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="392" height="272" rx="12" fill="#1e1e24" stroke="#33333d" stroke-width="1"/>
  </g>
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#dcdce4">
