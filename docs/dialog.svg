<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="660" height="460" role="img" aria-label="彻底删除会话的确认对话框">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="660" height="460" fill="#141417"/>
  <g filter="url(#shadow)">
    <rect x="24" y="20" width="612" height="392" rx="14" fill="#1e1e24" stroke="#33333d" stroke-width="1"/>
  </g>
  <g font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
    <text x="52" y="76" font-size="20" font-weight="600" fill="#f3f3f7">彻底删除这个会话？</text>
    <text x="52" y="116" font-size="13.5" fill="#c9c9d3">“重构支付流程”的聊天记录、标题与统计缓存、以及它产生的临时文件</text>
    <text x="52" y="138" font-size="13.5" fill="#c9c9d3">都会从这台电脑上删除。</text>
    <text x="52" y="176" font-size="13.5" fill="#e0a35c">删除后无法恢复，也无法再搜索或恢复这段对话。</text>
    <rect x="52" y="198" width="400" height="32" rx="8" fill="#26262e"/>
    <text x="64" y="219" font-size="13" fill="#a9a9b6">将删除 1 个会话、3 个文件（1.8 MB）。</text>
    <rect x="52" y="254" width="17" height="17" rx="4" fill="#4c8bf5" stroke="#4c8bf5"/>
    <path d="M56 262 l3 4 l6 -7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="268" font-size="13.5" fill="#dcdce4">同时删除它派生的子代理会话（2 个）</text>
    <g font-size="13.5">
      <rect x="356" y="336" width="100" height="38" rx="8" fill="none" stroke="#3c3c47" stroke-width="1"/>
      <text x="406" y="360" text-anchor="middle" fill="#d7d7e0">取消</text>
      <rect x="470" y="336" width="118" height="38" rx="8" fill="#d9494f"/>
      <text x="529" y="360" text-anchor="middle" fill="#fff" font-weight="600">彻底删除</text>
    </g>
  </g>
  <text x="24" y="440" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#6f6f7b">示意图（非截图）· 文案、顺序与插件实际渲染一致</text>
</svg>